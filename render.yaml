services:
  - type: web
    runtime: python
    name: astroMYLA
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header --limit-concurrency 100 --timeout-keep-alive 10
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PREMIUM_REPORT_TOKEN
        sync: false
      - key: OPENAI_PREMIUM_MODEL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: EXPOSE_DEBUG_DATA
        value: "false"
      - key: MAX_BODY_BYTES
        value: "1000000"
      - key: ALLOWED_HOSTS
        value: "astromyla.onrender.com"

  - type: web
    runtime: static
    name: astro-ai-site-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    domains:
      - astromyla.com
    envVars:
      - key: VITE_API_BASE_URL
        value: https://astromyla.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://astromyla.onrender.com https://geocoding-api.open-meteo.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https:; upgrade-insecure-requests"
      - path: /index.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
